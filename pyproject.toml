[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovis-runtime"
version = "0.1.0"
description = "Scaffold-only OVIS gateway and canonical state model packages."
requires-python = ">=3.11"
dependencies = [
    "openai>=1,<2",
    "pydantic>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
